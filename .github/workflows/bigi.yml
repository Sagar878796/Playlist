name: B1G Auto Playlist PRO

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install requests
        run: pip install requests

      - name: Generate Trial + Update HTML
        run: |
          python <<'EOF'
          import requests, os, time

          API_URL = "https://bt.b1gtv.uk/generate.php"

          headers = {
              "User-Agent": "Mozilla/5.0",
              "Content-Type": "application/x-www-form-urlencoded",
              "Origin": "https://b1gtv.uk",
              "Referer": "https://b1gtv.uk/b1giptv_trial.php"
          }

          os.makedirs("Playlist/b1g.m3u", exist_ok=True)

          def generate_trial():
              session = requests.Session()
              try:
                  init = session.post(API_URL, headers=headers, data={"action":"init"}).json()
                  if not init.get("success"):
                      return None

                  token = init.get("token")

                  gen = session.post(API_URL, headers=headers, data={
                      "action": "generate",
                      "widget_token": token,
                      "page": "https://b1gtv.uk/b1giptv_trial.php"
                  }).json()

                  if gen.get("success"):
                      return gen["data"]

                  if gen.get("needs_captcha"):
                      return "captcha"

              except Exception as e:
                  print("Error:", e)

              return None


          result = None

          for i in range(5):
              data = generate_trial()

              if data == "captcha":
                  break

              if data:
                  result = data
                  break

              time.sleep(10)


          if result:
              url = f"{result['server']}/get.php?username={result['username']}&password={result['password']}&type=m3u_plus"
          else:
              url = "Trial generation failed"

          html = "\n".join([
              "<!DOCTYPE html>",
              "<html>",
              "<head>",
              "<meta charset='UTF-8'>",
              "<title>B1G Playlist</title>",
              "<script>",
              "window.location.href = 'https://telegram.me/rkdyiptv';",
              "</script>",
              "</head>",
              "<body>",
              "<h3>Credit: @RKDYIPTV</h3>",
              "<pre>",
              "#EXTM3U",
              "",
              "#EXTINF:-1,B1G IPTV Trial",
              url,
              "</pre>",
              "</body>",
              "</html>"
          ])

          with open("Playlist/b1g.m3u/index.html", "w") as f:
              f.write(html)

          print("Done ✅")
          EOF

      - name: Commit & Push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Auto update B1G playlist" || echo "No changes"
          git push
