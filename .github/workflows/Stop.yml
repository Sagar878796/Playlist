name: Auto Update Cricket Playlist

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch & Filter ONLY Sports
        env:
          M3U_URL: ${{ secrets.M3U_SOURCE_URL }}
        run: |
          mkdir -p Playlist/Cricket.m3u

          echo "📥 Fetching M3U..."
          curl -fsSL "$M3U_URL" -o full.m3u

          echo "🎯 Filtering Sports..."

          awk '
          BEGIN {IGNORECASE=1}
          /^#EXTINF/ {
              line=$0
              getline url
              if (line ~ /group-title="Sports"/) {
                  print line
                  print url
              }
          }' full.m3u > sports.m3u

          echo "----- DEBUG (Sports Data) -----"
          cat sports.m3u || echo "⚠️ EMPTY FILE"

          echo "🛠 Creating index.html..."

          {
            echo "<script>"
            echo "window.location.href = \"https://telegram.me/rkdyiptv\";"
            echo "</script>"
            echo "<h3>🔥 FULL CREDIT: RKDYIPTV 🔥</h3>"
            echo "<pre>"
            cat sports.m3u
            echo "</pre>"
          } > Playlist/Cricket.m3u/index.html

      - name: Commit & Force Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          # Always commit (even if small change)
          git commit -m "🚀 Force Update [$(date +'%d-%m-%Y %H:%M')]" || echo "No changes"

          git push origin HEAD:main
