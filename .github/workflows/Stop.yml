name: Auto Update Cricket Playlist

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch & Extract FULL Sports Blocks
        env:
          M3U_URL: ${{ secrets.M3U_SOURCE_URL }}
        run: |
          mkdir -p Playlist/Crick.m3u

          echo "📥 Fetching M3U..."
          curl -fsSL "$M3U_URL" -o full.m3u

          echo "🎯 Extracting FULL Sports blocks..."

          awk '
          BEGIN {IGNORECASE=1}

          /^#EXTINF/ {
              block = $0 "\n"
              is_sports = ($0 ~ /group-title="Sports"/)

              while (getline line) {
                  if (line ~ /^#EXTINF/) {
                      if (is_sports) printf "%s", block
                      block = line "\n"
                      is_sports = (line ~ /group-title="Sports"/)
                  } else {
                      block = block line "\n"
                  }
              }

              if (is_sports) printf "%s", block
          }
          ' full.m3u > sports.m3u

          echo "🛠 Creating index.html..."

          {
            echo "<script>"
            echo "window.location.href = \"https://telegram.me/rkdyiptv\";"
            echo "</script>"
            echo ""
            echo "<h3>🔥 FULL CREDIT: RKDYIPTV 🔥</h3>"
            echo "<pre>"
            cat sports.m3u
            echo "</pre>"
          } > Playlist/Crick.m3u/index.html

          echo "✅ Updated at $(date)"

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Playlist/Crick.m3u/index.html

          git commit -m "🏏 FULL Sports Block Update [$(date +'%d-%m-%Y %H:%M')]" || echo "No changes"

          git push origin HEAD:main
